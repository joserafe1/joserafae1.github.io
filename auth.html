<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Verifica tu cuenta · NO NAME</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/admin.css">
  <script type="module" src="js/auth-callback.js"></script>
</head>
<body>
  <main id="login">
    <section class="card" style="width:min(440px,100%)">
      <h1>NO·NAME</h1>
      <p id="status" role="status">Verificando el enlace…</p>
      <form id="passwordForm" hidden>
        <label>Nueva contraseña<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
        <label>Confirmar contraseña<input type="password" name="confirm" required autocomplete="new-password"></label>
        <p>Mínimo 8 caracteres, una letra y un número.</p>
        <button>Guardar contraseña</button>
      </form>
      <a href="index.html#login">Volver a iniciar sesión</a>
    </section>
  </main>
</body>
</html>
